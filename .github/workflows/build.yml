name: build
on:
  push:
  workflow_dispatch:

jobs:
  linux:
    # 22.04 => binaries also run on older glibc; libcrypto is linked statically
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make -C server LDLIBS="-l:libcrypto.a -ldl -pthread"
      - run: ./server/kanki-server 2>&1 | grep -q usage && ./server/kanki-client 2>&1 | grep -q usage
      - uses: actions/upload-artifact@v4
        with:
          name: kanki-linux-x86_64
          path: |
            server/kanki-server
            server/kanki-client

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264      # = ndkVersion in client-android/app/build.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Cache OpenSSL for Android
        id: ossl
        uses: actions/cache@v4
        with:
          path: ~/openssl-android
          key: openssl-android-${{ env.NDK_VERSION }}-${{ hashFiles('client-android/build-openssl.sh') }}
      - name: Build OpenSSL for Android
        if: steps.ossl.outputs.cache-hit != 'true'
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION" client-android/build-openssl.sh "$HOME/openssl-android" arm64-v8a
      - name: Build APK
        working-directory: client-android
        run: ./gradlew --no-daemon assembleDebug -POPENSSL_ROOT="$HOME/openssl-android"
      - uses: actions/upload-artifact@v4
        with:
          name: kanki-android-apk
          path: client-android/app/build/outputs/apk/debug/app-debug.apk
