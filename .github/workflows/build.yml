name: build-and-test
on:
  push:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev openssl iproute2 iptables
      - name: Regression and API tests
        run: bash tests/run.sh
      - name: Real isolated TUN, NAT, DNS and loss tests
        run: sudo bash tests/linux_netns.sh
      - name: Real HTTPS cluster, two agents, TUN quota and crash test
        run: sudo python3 tests/cluster_netns.py
      - name: Build portable x86_64 artifacts with static libcrypto
        run: make -C server -B kanki-vpnd LDLIBS="-l:libcrypto.a -ldl -pthread"
      - uses: actions/upload-artifact@v4
        with:
          name: kanki-linux-x86_64
          path: server/kanki-vpnd
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android build tools
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1"
          sdk_status=${PIPESTATUS[1]}
          exit "$sdk_status"
      - name: Cache OpenSSL for Android
        id: ossl
        uses: actions/cache@v4
        with:
          path: ~/openssl-android
          key: openssl-android-${{ env.NDK_VERSION }}-${{ hashFiles('client-android/build-openssl.sh') }}
      - name: Build OpenSSL for Android
        if: steps.ossl.outputs.cache-hit != 'true'
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION" bash client-android/build-openssl.sh "$HOME/openssl-android" arm64-v8a
      - name: Build application, instrumentation APK and lint
        working-directory: client-android
        run: bash gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug -POPENSSL_ROOT="$HOME/openssl-android"
      - uses: actions/upload-artifact@v4
        with:
          name: kanki-android-apks-and-lint
          path: |
            client-android/app/build/outputs/apk/debug/app-debug.apk
            client-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            client-android/app/build/reports/lint-results-debug.*
