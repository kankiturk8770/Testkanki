plugins { id 'com.android.application' }

android {
    namespace 'com.kanki.tunnel'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.kanki.tunnel'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.4.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters (project.findProperty('KANKI_ABI') ?: 'arm64-v8a') }          // ABI OpenSSL was built for (build-openssl.sh)
        externalNativeBuild { cmake {
            cppFlags ''
            // -POPENSSL_ROOT=/path (or env OPENSSL_ROOT) -> CMake OPENSSL_ROOT
            def osslRoot = project.findProperty('OPENSSL_ROOT') ?: System.getenv('OPENSSL_ROOT') ?: ''
            arguments "-DOPENSSL_ROOT=${osslRoot}"
        } }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
