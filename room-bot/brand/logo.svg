<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#3a0d0b"/><stop offset=".6" stop-color="#160607"/><stop offset="1" stop-color="#070304"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset=".45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e5162b"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b30f1f"/><stop offset=".6" stop-color="#ff3b2f"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- devil horns -->
  <g filter="url(#glow)">
    <path d="M330 300 C 250 230, 235 140, 285 70 C 300 160, 345 215, 420 250 Z" fill="url(#horn)"/>
    <path d="M694 300 C 774 230, 789 140, 739 70 C 724 160, 679 215, 604 250 Z" fill="url(#horn)"/>
  </g>
  <!-- scope ring with crosshair ticks -->
  <g filter="url(#glow)" fill="none" stroke="url(#fire)" stroke-linecap="round">
    <circle cx="512" cy="560" r="300" stroke-width="34"/>
    <circle cx="512" cy="560" r="236" stroke-width="6" stroke-dasharray="4 26" opacity=".7"/>
    <path d="M512 228v86M512 806v86M180 560h86M758 560h86" stroke-width="30"/>
  </g>
  <!-- name -->
  <text x="512" y="628" text-anchor="middle" font-family="Impact, 'Arial Black', 'DejaVu Sans', sans-serif" font-weight="900"
        font-size="230" letter-spacing="6" fill="#fff4e0" stroke="#ff5a1f" stroke-width="6" filter="url(#glow)">UF</text>
  <text x="512" y="720" text-anchor="middle" font-family="'Arial Black', 'DejaVu Sans', sans-serif" font-weight="900"
        font-size="58" letter-spacing="14" fill="#ffb347">DEVIL</text>
  <!-- red dot of the scope -->
  <circle cx="512" cy="400" r="30" fill="#ff2a2a" opacity=".35"/><circle cx="512" cy="400" r="14" fill="#ff3b3b"/>
</svg>
