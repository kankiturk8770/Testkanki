<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Music Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="views">
  <!-- search -->
  <section class="view active" id="v-search">
    <form id="search-form" class="searchbar">
      <input id="q" type="search" placeholder="اسم آهنگ، خواننده یا یه تیکه از متن..." autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="جستجو">🔎</button>
    </form>
    <div class="chips" id="search-chips">
      <button class="chip" data-suffix="">همه</button>
      <button class="chip" data-suffix=" remix">ریمیکس</button>
      <button class="chip" data-suffix=" live">لایو</button>
      <button class="chip" data-suffix=" cover">کاور</button>
      <button class="chip" data-suffix=" slowed reverb">اسلو</button>
    </div>
    <div id="search-results" class="list"><p class="empty">هرچی دنبالشی بنویس؛ از یوتیوب و ساندکلاد پیدا می‌کنم 🎵</p></div>
  </section>

  <!-- listen -->
  <section class="view" id="v-listen">
    <div class="listen-wrap">
      <button id="listen-btn" class="listen-btn"><span class="ring"></span><span id="listen-label">🎧<br>گوش بده</span></button>
      <p id="listen-status" class="muted">بزن و گوشی رو نزدیک صدای آهنگ بگیر (حدود ۱۲ ثانیه)</p>
      <label class="toggle"><input type="checkbox" id="hum"> خودم می‌خونم / زمزمه می‌کنم</label>
      <label class="file-btn">📁 انتخاب فایل صوتی/ویدیویی<input type="file" id="listen-file" accept="audio/*,video/*" hidden></label>
    </div>
    <div id="listen-result"></div>
  </section>

  <!-- library -->
  <section class="view" id="v-library">
    <div id="lib-root">
      <div class="lib-head">
        <h2>کتابخانه</h2>
        <button class="btn small" id="new-pl">➕ پلی‌لیست</button>
      </div>
      <div id="lib-cards" class="cards"></div>
    </div>
    <div id="lib-detail" hidden>
      <div class="lib-head">
        <button class="btn small ghost" id="lib-back">→ برگشت</button>
        <h2 id="lib-title"></h2>
        <span id="lib-actions"></span>
      </div>
      <div class="row gap">
        <button class="btn" id="lib-play">▶ پخش همه</button>
        <button class="btn ghost" id="lib-shuffle">🔀 تصادفی</button>
      </div>
      <div id="lib-list" class="list"></div>
    </div>
  </section>

  <!-- history -->
  <section class="view" id="v-history">
    <div class="lib-head"><h2>تاریخچه</h2><button class="btn small ghost" id="hist-clear">🗑 پاک کردن</button></div>
    <div class="chips" id="hist-chips">
      <button class="chip on" data-kind="">همه</button>
      <button class="chip" data-kind="search">جستجو</button>
      <button class="chip" data-kind="recognize">تشخیص</button>
      <button class="chip" data-kind="play">پخش</button>
      <button class="chip" data-kind="download">دانلود</button>
      <button class="chip" data-kind="edit">ویرایش</button>
    </div>
    <div id="hist-list" class="list"></div>
  </section>
</main>

<!-- mini player -->
<div id="mini" class="mini" hidden>
  <img id="mini-cover" alt="">
  <div class="mini-meta"><b id="mini-title"></b><small id="mini-artist"></small></div>
  <button id="mini-play" class="icon">▶</button>
  <button id="mini-next" class="icon">⏭</button>
  <div class="mini-progress"><i id="mini-bar"></i></div>
</div>

<nav class="tabs">
  <button data-view="v-search" class="on">🔎<span>جستجو</span></button>
  <button data-view="v-listen">🎙<span>تشخیص</span></button>
  <button data-view="v-library">📚<span>کتابخانه</span></button>
  <button data-view="v-history">🕘<span>تاریخچه</span></button>
</nav>

<!-- full player -->
<div id="player" class="sheet" hidden>
  <div class="sheet-head">
    <button class="icon" id="player-close">⌄</button>
    <small id="player-src"></small>
    <button class="icon" id="player-queue-btn">☰</button>
  </div>
  <div class="cover-wrap" id="cover-wrap"><img id="p-cover" alt=""><div class="loading" id="p-loading">⏳ در حال آماده‌سازی...</div></div>
  <div class="p-meta">
    <div><h3 id="p-title"></h3><p id="p-artist" class="muted"></p></div>
    <button class="icon big" id="p-like">🤍</button>
  </div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="icon" id="p-shuffle" title="تصادفی">🔀</button>
    <button class="icon big" id="p-prev">⏮</button>
    <button class="icon huge" id="p-play">▶</button>
    <button class="icon big" id="p-next">⏭</button>
    <button class="icon" id="p-repeat" title="تکرار">🔁</button>
  </div>
  <div class="controls small">
    <button class="icon" id="p-back10">↺10</button>
    <select id="p-rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
    <button class="icon" id="p-fwd10">10↻</button>
  </div>
  <div class="actions">
    <button class="btn" data-panel="edit">✂️ برش و افکت</button>
    <button class="btn" data-panel="send">📩 ارسال به چت</button>
    <button class="btn" id="p-add">➕ پلی‌لیست</button>
    <button class="btn" id="p-remix">🔁 ریمیکس</button>
  </div>

  <div class="panel" id="panel-edit" hidden>
    <h4>✂️ ویرایشگر (برش، رینگتون، افکت)</h4>
    <div class="cut-bar" id="cut-bar"><div class="sel" id="cut-sel"></div><div class="head" id="cut-head"></div></div>
    <label>شروع: <b id="cut-a-t">0:00</b>
      <input type="range" id="cut-a" min="0" max="100" step="0.1" value="0"></label>
    <div class="row gap"><button class="btn small ghost" data-nudge="a:-1">-1s</button><button class="btn small ghost" data-mark="a">📍 از همین لحظه</button><button class="btn small ghost" data-nudge="a:1">+1s</button></div>
    <label>پایان: <b id="cut-b-t">0:30</b>
      <input type="range" id="cut-b" min="0" max="100" step="0.1" value="30"></label>
    <div class="row gap"><button class="btn small ghost" data-nudge="b:-1">-1s</button><button class="btn small ghost" data-mark="b">📍 تا همین لحظه</button><button class="btn small ghost" data-nudge="b:1">+1s</button></div>
    <div class="row gap wrap">
      <button class="btn small ghost" id="cut-whole">کل آهنگ</button>
      <button class="btn small ghost" id="cut-ring">🔔 ۳۰ ثانیه رینگتون</button>
      <span class="muted">طول: <b id="cut-len">30s</b></span>
    </div>
    <h4>🎛 افکت</h4>
    <div class="chips wrap" id="fx-chips">
      <button class="chip on" data-fx="">بدون افکت</button>
      <button class="chip" data-fx="slow">🐢 اسلو + ریورب</button>
      <button class="chip" data-fx="fast">⚡ تند</button>
      <button class="chip" data-fx="bass">🔊 باس</button>
      <button class="chip" data-fx="8d">🎧 8D</button>
      <button class="chip" data-fx="karaoke">🎤 بی‌کلام</button>
      <button class="chip" data-fx="loud">📢 بلندتر</button>
    </div>
    <div class="row gap wrap">
      <label class="toggle"><input type="checkbox" id="cut-fade" checked> فید اول و آخر</label>
      <select id="cut-fmt"><option value="audio">🎵 فایل mp3</option><option value="voice">🎙 ویس تلگرام</option></select>
    </div>
    <div class="row gap">
      <button class="btn" id="cut-preview">▶ گوش دادن زنده</button>
      <button class="btn primary" id="cut-send">📩 بساز و بفرست تو چت</button>
    </div>
    <p class="muted small-note" id="edit-status">پردازش روی گوشی خودت انجام میشه و نتیجه تو چت ربات میاد.</p>
  </div>

  <div class="panel" id="panel-send" hidden>
    <h4>🎧 آهنگ</h4>
    <div class="row gap wrap" id="send-audio"></div>
    <h4>🎬 ویدیو</h4>
    <div class="row gap wrap" id="send-video"></div>
    <div class="row gap"><button class="btn ghost" data-send="voice:">🎙 به صورت ویس</button></div>
  </div>

  <div class="panel" id="panel-queue" hidden>
    <h4>صف پخش</h4>
    <div id="queue-list" class="list"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
