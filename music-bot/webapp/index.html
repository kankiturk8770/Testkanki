<!doctype html>
<html lang="fa" dir="rtl" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kanki Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><span class="logo">K</span><b>KANKI</b><i>MUSIC</i></div>
  <button class="icon-btn" id="theme-btn" title="تم">🎨</button>
</header>

<main id="views">
  <!-- search -->
  <section class="view active" id="v-search">
    <form id="search-form" class="searchbar glass">
      <input id="q" type="search" placeholder="اسم آهنگ، خواننده یا یه تیکه از متن…" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="gold-btn" aria-label="جستجو">جستجو</button>
    </form>
    <div class="chips" id="search-chips">
      <button class="chip on" data-suffix="">همه</button>
      <button class="chip" data-suffix=" remix">ریمیکس</button>
      <button class="chip" data-suffix=" live">لایو</button>
      <button class="chip" data-suffix=" cover">کاور</button>
      <button class="chip" data-suffix=" slowed reverb">اسلو</button>
    </div>
    <div id="search-results" class="list"><p class="empty">هرچی دنبالشی بنویس؛ از یوتیوب، رادیوجوان و ساندکلاد پیدا می‌کنم 🎵</p></div>
  </section>

  <!-- listen -->
  <section class="view" id="v-listen">
    <div class="listen-wrap">
      <button id="listen-btn" class="orb">
        <span class="halo"></span><span class="halo h2"></span>
        <span class="orb-core"><span id="listen-label">🎧<br>گوش بده</span></span>
      </button>
      <p id="listen-status" class="muted">بزن و گوشی رو نزدیک صدای آهنگ بگیر</p>
      <div class="seg" id="listen-mode">
        <button class="on" data-mode="song">🎵 آهنگ پخش میشه</button>
        <button data-mode="sing">🎤 خودم می‌خونم</button>
      </div>
      <select id="sing-lang" class="pill" hidden>
        <option value="fa-IR">فارسی</option><option value="en-US">English</option><option value="tr-TR">Türkçe</option><option value="ar-SA">العربية</option>
      </select>
      <label class="link-btn">📁 انتخاب فایل صوتی/ویدیویی<input type="file" id="listen-file" accept="audio/*,video/*" hidden></label>
    </div>
    <div id="listen-result"></div>
  </section>

  <!-- library -->
  <section class="view" id="v-library">
    <div id="lib-root">
      <div class="head-row"><h2>کتابخانه</h2><button class="pill" id="new-pl">➕ پلی‌لیست</button></div>
      <div id="lib-cards" class="cards"></div>
    </div>
    <div id="lib-detail" hidden>
      <div class="head-row">
        <button class="pill" id="lib-back">→</button>
        <h2 id="lib-title"></h2>
        <span id="lib-actions"></span>
      </div>
      <div class="row gap">
        <button class="gold-btn" id="lib-play">▶ پخش همه</button>
        <button class="pill" id="lib-shuffle">🔀 تصادفی</button>
      </div>
      <div id="lib-list" class="list"></div>
    </div>
  </section>

  <!-- history -->
  <section class="view" id="v-history">
    <div class="head-row"><h2>تاریخچه</h2><button class="pill" id="hist-clear">🗑 پاک کردن</button></div>
    <div class="chips" id="hist-chips">
      <button class="chip on" data-kind="">همه</button>
      <button class="chip" data-kind="search">جستجو</button>
      <button class="chip" data-kind="recognize">تشخیص</button>
      <button class="chip" data-kind="play">پخش</button>
      <button class="chip" data-kind="download">دانلود</button>
      <button class="chip" data-kind="edit">ویرایش</button>
    </div>
    <div id="hist-list" class="list"></div>
  </section>
</main>

<!-- mini player -->
<div id="mini" class="mini glass" hidden>
  <img id="mini-cover" alt="">
  <div class="mini-meta"><b id="mini-title"></b><small id="mini-artist"></small></div>
  <button id="mini-play" class="round sm">▶</button>
  <button id="mini-next" class="icon-btn">⏭</button>
  <div class="mini-progress"><i id="mini-bar"></i></div>
</div>

<nav class="tabs glass">
  <button data-view="v-search" class="on"><span>🔎</span>جستجو</button>
  <button data-view="v-listen"><span>🎙</span>تشخیص</button>
  <button data-view="v-library"><span>📚</span>کتابخانه</button>
  <button data-view="v-history"><span>🕘</span>تاریخچه</button>
</nav>

<!-- full player -->
<div id="player" class="sheet" hidden>
  <div class="sheet-head">
    <button class="icon-btn" id="player-close">⌄</button>
    <small id="player-src"></small>
    <button class="icon-btn" id="player-queue-btn" title="صف پخش">☰</button>
  </div>

  <div class="cover-wrap" id="cover-wrap">
    <img id="p-cover" alt="">
    <canvas id="viz" width="600" height="120"></canvas>
    <div class="loading" id="p-loading" hidden>⏳</div>
  </div>

  <div class="p-meta">
    <div class="p-text"><h3 id="p-title"></h3><p id="p-artist" class="muted"></p></div>
    <button class="icon-btn big" id="p-like">🤍</button>
  </div>

  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="p-shuffle" title="تصادفی">🔀</button>
    <button class="icon-btn" id="p-back10" title="۱۰ ثانیه عقب">↺</button>
    <button class="icon-btn big" id="p-prev">⏮</button>
    <button class="round" id="p-play">▶</button>
    <button class="icon-btn big" id="p-next">⏭</button>
    <button class="icon-btn" id="p-fwd10" title="۱۰ ثانیه جلو">↻</button>
    <button class="icon-btn" id="p-repeat" title="تکرار">🔁</button>
  </div>

  <div class="volume glass">
    <button class="icon-btn" id="vol-mute">🔊</button>
    <input type="range" id="vol" min="0" max="150" value="100">
    <span id="vol-val" class="muted">100</span>
  </div>

  <div class="tools">
    <button class="tool" data-panel="eq"><span>🎚</span>اکولایزر</button>
    <button class="tool" data-panel="edit"><span>✂️</span>ویرایش</button>
    <button class="tool" data-panel="send"><span>📩</span>ارسال</button>
    <button class="tool" id="p-add"><span>➕</span>پلی‌لیست</button>
    <button class="tool" id="p-remix"><span>🔁</span>ریمیکس</button>
    <button class="tool" data-panel="more"><span>⚙️</span>بیشتر</button>
  </div>

  <div class="panel glass" id="panel-eq" hidden>
    <h4>🎚 اکولایزر</h4>
    <div class="chips wrap" id="eq-presets">
      <button class="chip on" data-eq="flat">معمولی</button>
      <button class="chip" data-eq="bass">باس</button>
      <button class="chip" data-eq="vocal">وکال</button>
      <button class="chip" data-eq="treble">زیر</button>
      <button class="chip" data-eq="party">پارتی</button>
    </div>
    <div class="eq-bands">
      <label>بم<input type="range" id="eq-low" min="-12" max="12" value="0" orient="vertical"></label>
      <label>میانی<input type="range" id="eq-mid" min="-12" max="12" value="0" orient="vertical"></label>
      <label>زیر<input type="range" id="eq-high" min="-12" max="12" value="0" orient="vertical"></label>
    </div>
  </div>

  <div class="panel glass" id="panel-more" hidden>
    <h4>⚙️ پخش</h4>
    <div class="row gap wrap">
      <span class="muted">سرعت:</span>
      <div class="chips wrap" id="rate-chips">
        <button class="chip" data-rate="0.75">0.75×</button><button class="chip on" data-rate="1">1×</button>
        <button class="chip" data-rate="1.25">1.25×</button><button class="chip" data-rate="1.5">1.5×</button>
      </div>
    </div>
    <div class="row gap wrap">
      <span class="muted">تایمر خواب:</span>
      <div class="chips wrap" id="sleep-chips">
        <button class="chip on" data-sleep="0">خاموش</button><button class="chip" data-sleep="15">۱۵ دقیقه</button>
        <button class="chip" data-sleep="30">۳۰ دقیقه</button><button class="chip" data-sleep="60">۱ ساعت</button>
        <button class="chip" data-sleep="end">آخر آهنگ</button>
      </div>
    </div>
    <label class="toggle"><input type="checkbox" id="crossfade"> محو شدن نرم بین آهنگ‌ها</label>
  </div>

  <div class="panel glass" id="panel-edit" hidden>
    <div class="seg" id="edit-mode">
      <button class="on" data-mode="cut">✂️ برش</button>
      <button data-mode="ringtone">🔔 رینگتون</button>
      <button data-mode="fx">🎛 افکت</button>
    </div>
    <div class="cut-bar" id="cut-bar"><div class="sel" id="cut-sel"></div><div class="head" id="cut-head"></div></div>
    <div class="cut-times">
      <div><small class="muted">شروع</small><b id="cut-a-t">0:00</b>
        <div class="row"><button class="pill sm" data-nudge="a:-1">−</button><button class="pill sm" data-mark="a">📍</button><button class="pill sm" data-nudge="a:1">+</button></div></div>
      <div class="len"><small class="muted">طول</small><b id="cut-len">30s</b></div>
      <div><small class="muted">پایان</small><b id="cut-b-t">0:30</b>
        <div class="row"><button class="pill sm" data-nudge="b:-1">−</button><button class="pill sm" data-mark="b">📍</button><button class="pill sm" data-nudge="b:1">+</button></div></div>
    </div>
    <input type="range" id="cut-a" min="0" max="100" step="0.1" value="0">
    <input type="range" id="cut-b" min="0" max="100" step="0.1" value="30">
    <div class="chips wrap" id="fx-chips" hidden>
      <button class="chip on" data-fx="">بدون افکت</button>
      <button class="chip" data-fx="slow">🐢 اسلو + ریورب</button>
      <button class="chip" data-fx="fast">⚡ تند</button>
      <button class="chip" data-fx="bass">🔊 باس</button>
      <button class="chip" data-fx="8d">🎧 8D</button>
      <button class="chip" data-fx="karaoke">🎤 بی‌کلام</button>
      <button class="chip" data-fx="loud">📢 بلندتر</button>
    </div>
    <div class="row gap wrap">
      <label class="toggle"><input type="checkbox" id="cut-fade" checked> فید</label>
      <select id="cut-fmt" class="pill"><option value="audio">🎵 mp3</option><option value="voice">🎙 ویس</option></select>
      <button class="pill" id="cut-whole">کل آهنگ</button>
    </div>
    <div class="row gap">
      <button class="pill grow" id="cut-preview">▶ گوش دادن</button>
      <button class="gold-btn grow" id="cut-send">📩 بساز و بفرست</button>
    </div>
    <p class="muted note" id="edit-status">پردازش روی گوشی خودت انجام میشه؛ نتیجه تو چت ربات میاد.</p>
  </div>

  <div class="panel glass" id="panel-send" hidden>
    <h4>🎧 آهنگ</h4>
    <div class="row gap wrap" id="send-audio"></div>
    <h4>🎬 ویدیو</h4>
    <div class="row gap wrap" id="send-video"></div>
    <div class="row gap"><button class="pill" data-send="voice:">🎙 به صورت ویس</button></div>
  </div>

  <div class="panel glass" id="panel-queue" hidden>
    <h4>صف پخش</h4>
    <div id="queue-list" class="list"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
