<!doctype html>
<html lang="fa" dir="rtl" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kanki Music</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><img src="logo.svg" class="logo-img" alt=""><b>KANKI</b><i>MUSIC</i></div>
  <div class="top-actions">
    <button class="pill bot-pill" id="bot-btn"><i data-i="chat"></i> برگشت به ربات</button>
    <button class="icon-btn" id="theme-btn" title="تم"><i data-i="palette"></i></button>
  </div>
</header>

<main id="views">
  <!-- search -->
  <section class="view active" id="v-search">
    <form id="search-form" class="searchbar glass">
      <i data-i="search" class="muted"></i>
      <input id="q" type="search" placeholder="اسم آهنگ، خواننده یا یه تیکه از متن…" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="gold-btn">جستجو</button>
    </form>
    <div class="chips" id="search-chips">
      <button class="chip on" data-suffix="">همه</button>
      <button class="chip" data-suffix=" remix">ریمیکس</button>
      <button class="chip" data-suffix=" live">لایو</button>
      <button class="chip" data-suffix=" slowed reverb">اسلو</button>
    </div>
    <div id="search-results" class="list"><p class="empty">اسم آهنگ رو بنویس 🎵</p></div>
  </section>

  <!-- listen -->
  <section class="view" id="v-listen">
    <div class="listen-wrap">
      <button id="listen-btn" class="orb">
        <span class="halo"></span><span class="halo h2"></span>
        <span class="orb-core"><i data-i="mic" class="xl"></i><span id="listen-label">گوش بده</span></span>
      </button>
      <p id="listen-status" class="status muted">بزن و گوشی رو نزدیک صدای آهنگ بگیر</p>
      <div class="seg" id="listen-mode">
        <button class="on" data-mode="song">آهنگ پخش میشه</button>
        <button data-mode="sing">خودم می‌خونم</button>
      </div>
      <select id="sing-lang" class="pill" hidden>
        <option value="fa-IR">فارسی</option><option value="en-US">English</option><option value="tr-TR">Türkçe</option><option value="ar-SA">العربية</option>
      </select>
      <label class="pill file-pill"><i data-i="upload"></i> انتخاب فایل صوتی یا ویدیویی<input type="file" id="listen-file" accept="audio/*,video/*" hidden></label>
    </div>
    <div id="listen-result"></div>
  </section>

  <!-- library -->
  <section class="view" id="v-library">
    <div id="lib-root">
      <div class="head-row"><h2>کتابخانه</h2><button class="pill" id="new-pl"><i data-i="plus"></i> پلی‌لیست جدید</button></div>
      <div id="lib-cards" class="cards"></div>
    </div>
    <div id="lib-detail" hidden>
      <div class="pl-hero glass">
        <button class="icon-btn back" id="lib-back"><i data-i="back"></i></button>
        <div class="mosaic big" id="lib-mosaic"></div>
        <div class="pl-info">
          <h2 id="lib-title"></h2>
          <small id="lib-count" class="muted"></small>
          <div class="row gap">
            <button class="gold-btn" id="lib-play"><i data-i="play"></i> پخش</button>
            <button class="pill" id="lib-shuffle"><i data-i="shuffle"></i></button>
            <span id="lib-actions"></span>
          </div>
        </div>
      </div>
      <div id="lib-list" class="list"></div>
    </div>
  </section>

  <!-- history -->
  <section class="view" id="v-history">
    <div class="head-row"><h2>تاریخچه</h2><button class="pill" id="hist-clear"><i data-i="trash"></i> پاک کردن</button></div>
    <div class="chips" id="hist-chips">
      <button class="chip on" data-kind="">همه</button>
      <button class="chip" data-kind="search">جستجو</button>
      <button class="chip" data-kind="recognize">پیدا شده</button>
      <button class="chip" data-kind="play">پخش</button>
      <button class="chip" data-kind="download">دانلود</button>
    </div>
    <div id="hist-list" class="list"></div>
  </section>
</main>

<!-- "find the song of what I sent in the chat" -->
<div id="rec-screen" class="rec-screen" hidden>
  <div class="orb busy"><span class="halo"></span><span class="halo h2"></span><span class="orb-core"><i data-i="mic" class="xl"></i></span></div>
  <h3 id="rec-title">دارم پیدا می‌کنم…</h3>
  <p id="rec-sub" class="muted"></p>
  <div class="row gap" id="rec-actions" hidden>
    <button class="gold-btn" id="rec-retry">دوباره</button>
    <button class="pill" id="rec-close">بستن</button>
  </div>
</div>

<!-- mini player -->
<div id="mini" class="mini glass" hidden>
  <img id="mini-cover" alt="">
  <div class="mini-meta"><b id="mini-title"></b><small id="mini-artist"></small></div>
  <button id="mini-play" class="round sm"><i data-i="play"></i></button>
  <button id="mini-next" class="icon-btn"><i data-i="next"></i></button>
  <div class="mini-progress"><i id="mini-bar"></i></div>
</div>

<nav class="tabs glass">
  <button data-view="v-search" class="on"><i data-i="search"></i>جستجو</button>
  <button data-view="v-listen"><i data-i="mic"></i>پیدا کن</button>
  <button data-view="v-library"><i data-i="folder"></i>کتابخانه</button>
  <button data-view="v-history"><i data-i="clock"></i>تاریخچه</button>
</nav>

<!-- full player -->
<div id="player" class="sheet" hidden>
  <div class="sheet-head">
    <button class="icon-btn" id="player-close"><i data-i="down"></i></button>
    <small id="player-src"></small>
    <div class="top-actions">
      <button class="icon-btn" id="player-bot" title="برگشت به ربات"><i data-i="chat"></i></button>
      <button class="icon-btn" id="player-queue-btn" title="صف پخش"><i data-i="list"></i></button>
    </div>
  </div>

  <div class="cover-wrap" id="cover-wrap">
    <img id="p-cover" alt="">
    <div class="loading" id="p-loading" hidden><span class="spinner"></span><b id="p-loading-text"></b></div>
  </div>

  <div class="p-meta">
    <div class="p-text"><h3 id="p-title"></h3><p id="p-artist" class="muted"></p></div>
    <div class="eqbars" id="eqbars"><i></i><i></i><i></i><i></i></div>
    <button class="icon-btn big" id="p-like"><i data-i="heart"></i></button>
  </div>

  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="p-mode" title="حالت پخش"><i data-i="repeat"></i></button>
    <button class="icon-btn big" id="p-prev"><i data-i="prev"></i></button>
    <button class="round" id="p-play"><i data-i="play"></i></button>
    <button class="icon-btn big" id="p-next"><i data-i="next"></i></button>
    <button class="icon-btn" id="vol-btn" title="صدا"><i data-i="volume"></i></button>
  </div>
  <div class="volume" id="vol-row" hidden>
    <i data-i="volume-low" class="muted"></i>
    <input type="range" id="vol" min="0" max="100" value="100">
    <i data-i="volume" class="muted"></i>
  </div>

  <div class="tools">
    <button class="tool" data-panel="edit"><span><i data-i="scissors"></i></span>برش</button>
    <button class="tool" data-panel="send"><span><i data-i="send"></i></span>ارسال به چت</button>
    <button class="tool" id="p-add"><span><i data-i="list-plus"></i></span>پلی‌لیست</button>
    <button class="tool" id="p-remix"><span><i data-i="disc"></i></span>ریمیکس‌ها</button>
  </div>

  <div class="panel glass" id="panel-edit" hidden>
    <div class="cut-bar" id="cut-bar"><div class="sel" id="cut-sel"></div><div class="head" id="cut-head"></div></div>
    <div class="cut-row"><span class="cut-lbl">شروع</span><input type="range" id="cut-a" min="0" max="100" step="0.1" value="0"><b id="cut-a-t">0:00</b></div>
    <div class="cut-row"><span class="cut-lbl">پایان</span><input type="range" id="cut-b" min="0" max="100" step="0.1" value="30"><b id="cut-b-t">0:30</b></div>
    <p class="muted note center">دسته‌ها رو بکش تا بخش دلخواهت انتخاب بشه · طول: <b id="cut-len">30s</b></p>
    <div class="row gap">
      <button class="pill grow" id="cut-preview"><i data-i="play"></i> گوش دادن</button>
      <button class="gold-btn grow" id="cut-send"><i data-i="send"></i> بفرست تو چت</button>
    </div>
    <p class="muted note center" id="edit-status"></p>
  </div>

  <div class="panel glass" id="panel-send" hidden>
    <div class="row gap wrap" id="send-audio"></div>
    <div class="row gap wrap" id="send-video"></div>
  </div>

  <div class="panel glass" id="panel-queue" hidden>
    <h4>صف پخش</h4>
    <div id="queue-list" class="list"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
